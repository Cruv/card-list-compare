user abc abc;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Generated from the container's DNS configuration by the entrypoint. Fixed
    # external hosts resolve on demand, so offline startup still serves CLC.
    include /etc/nginx/clc-resolver.conf;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ──────────────────────────────────────
        # NOTE: nginx add_header does NOT inherit into a location that sets its
        # own add_header — the document responses below (= /index.html) repeat
        # these. CSP matches the app's real origins: no inline scripts in the
        # Vite build (script-src 'self' is safe), external card images from
        # Scryfall, MPC art from Google Drive, everything else same-origin via
        # the /api proxies. Spot-check the browser console for CSP violations
        # after a deploy if new external resources are added.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cards.scryfall.io https://*.scryfall.io https://drive.google.com data: blob:; font-src 'self' data:; connect-src 'self' https://api.scryfall.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        # Archidekt API proxy
        location /api/archidekt/ {
            set $external_host archidekt.com;
            rewrite ^/api/archidekt/(.*)$ /api/$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host archidekt.com;
            proxy_set_header Origin https://archidekt.com;
            proxy_ssl_server_name on;
        }

        # Moxfield API proxy
        location /api/moxfield/ {
            set $external_host api2.moxfield.com;
            rewrite ^/api/moxfield/(.*)$ /$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host api2.moxfield.com;
            proxy_set_header User-Agent "CardListCompare/1.0";
            proxy_ssl_server_name on;
        }

        # DeckCheck API proxy
        location /api/deckcheck/ {
            set $external_host deckcheck.co;
            rewrite ^/api/deckcheck/(.*)$ /api/$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host deckcheck.co;
            proxy_ssl_server_name on;
        }

        # TappedOut proxy
        location /api/tappedout/ {
            set $external_host tappedout.net;
            rewrite ^/api/tappedout/(.*)$ /$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host tappedout.net;
            proxy_ssl_server_name on;
        }

        # Deckstats proxy
        location /api/deckstats/ {
            set $external_host deckstats.net;
            rewrite ^/api/deckstats/(.*)$ /$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host deckstats.net;
            proxy_ssl_server_name on;
        }

        # MTGGoldfish proxy (dev vite config proxies this too — keep in sync)
        location /api/mtggoldfish/ {
            set $external_host www.mtggoldfish.com;
            rewrite ^/api/mtggoldfish/(.*)$ /$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host www.mtggoldfish.com;
            proxy_ssl_server_name on;
        }

        # TCGPlayer (infinite) proxy
        location /api/tcgplayer/ {
            set $external_host infinite.tcgplayer.com;
            rewrite ^/api/tcgplayer/(.*)$ /$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host infinite.tcgplayer.com;
            proxy_ssl_server_name on;
        }

        # Scryfall API proxy
        location /api/scryfall/ {
            set $external_host api.scryfall.com;
            rewrite ^/api/scryfall/(.*)$ /$1 break;
            proxy_pass https://$external_host;
            proxy_set_header Host api.scryfall.com;
            proxy_ssl_server_name on;
        }

        # Backend API proxy (all /api/ routes not matched above)
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append) any client-sent value — nginx is the only
            # trusted hop, and Express runs `trust proxy: 1`. Without this,
            # req.ip is 127.0.0.1 for everyone (one shared rate-limit bucket) and
            # a client could spoof its IP. See audit H3.
            proxy_set_header X-Forwarded-For $remote_addr;
            # Synchronous work (MPC image ZIP builds, large Scryfall batches) can
            # exceed nginx's 60s default and 504. Give the backend room.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # index.html must never be cached, or clients keep loading a stale app
        # shell (old JS refs) after a deploy. Repeats the security headers because
        # this add_header block would otherwise drop the inherited ones.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://cards.scryfall.io https://*.scryfall.io https://drive.google.com data: blob:; font-src 'self' data:; connect-src 'self' https://api.scryfall.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        }

        # SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets (hashed filenames — safe to cache forever)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
