services:
  card-list-compare:
    image: ghcr.io/cruv/card-list-compare:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      # No placeholder default — an unset secret must NOT silently become a
      # public well-known value. The container itself refuses to start unless
      # this is strong (server/lib/jwtSecret.js, NODE_ENV=production is baked
      # into the image), and it prints how to generate one. Deliberately not
      # `${JWT_SECRET:?...}`: that form also breaks `docker compose down/ps/logs`,
      # which you need most when something is already wrong.
      # Put it in a local .env (see .env.example): JWT_SECRET=$(openssl rand -hex 32)
      - JWT_SECRET=${JWT_SECRET:-}
      - DB_PATH=/app/data/cardlistcompare.db
      - TZ=America/New_York
    volumes:
      # Bind mount — DB and data live on the host at ./data/
      # Easy to back up, inspect, and persist across image rebuilds
      - ./data:/app/data
    restart: unless-stopped
    # Give node time to flush on `docker stop` before SIGKILL (audit C3 / Batch 4)
    stop_grace_period: 30s
