services:
  card-list-compare:
    # CI publishes this image from main. CLC_IMAGE can select a verified SHA tag
    # or registry digest without changing this deployment contract.
    image: ${CLC_IMAGE:-ghcr.io/cruv/card-list-compare:latest}
    container_name: ${CLC_CONTAINER_NAME:-card-list-compare}
    ports:
      - "${CLC_PORT:-8080}:80"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Keep secrets in private runtime variables, never in the repository.
      # Blank JWT configuration still permits Compose ps/logs/down; the server
      # rejects a weak or missing signing secret before serving production.
      - JWT_SECRET=${JWT_SECRET:-}
      - DB_PATH=/app/data/cardlistcompare.db
      - MANASYNC_BRIDGE_KEY=${MANASYNC_BRIDGE_KEY:-}
      - PRINT_ENABLED=${PRINT_ENABLED:-true}
      - PRINT_STATION_TOKEN=${PRINT_STATION_TOKEN:-}
      - PRINT_ALLOWED_USER_IDS=${PRINT_ALLOWED_USER_IDS:-}
      - PRINT_STORAGE_MAX_MB=${PRINT_STORAGE_MAX_MB:-10240}
      - TZ=${TZ:-America/New_York}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@cardlistcompare.local}
    volumes:
      - type: bind
        # Use the ORIGINAL absolute path when adopting an existing installation.
        # Create this directory explicitly only for a fresh installation.
        source: ${CLC_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      # Apply updates deliberately after checking physical print work is idle.
      com.centurylinklabs.watchtower.enable: "false"
